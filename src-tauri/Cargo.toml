[package]
name = "pomotroid"
version = "1.8.0"
description = "A simple and visually-pleasing Pomodoro timer"
authors = ["Christopher Murphy <flyweight@pm.me>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pomotroid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ---------------------------------------------------------------------------
# Dependencies shared by desktop and mobile builds
# ---------------------------------------------------------------------------
[dependencies]
# `tray-icon` is gated to desktop targets inside tauri itself, so it is safe here.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

rusqlite = { version = "0.40", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# WebSocket client used by the "connect to desktop" (remote follow) mode.
# No TLS: pairing is LAN-only over plain ws://.
tokio-tungstenite = "0.29"

# ---------------------------------------------------------------------------
# Desktop-only dependencies (server, tray, rodio playback, global shortcuts,
# updater, theme hot-reload watcher)
# ---------------------------------------------------------------------------
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
# Enumerates network adapters so the pairing address can be chosen.
if-addrs = "0.13"
axum = { version = "0.8", features = ["ws"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "mp3", "vorbis"] }
symphonia-codec-adpcm = "0.6.0"
tiny-skia = "0.12"
notify = "8"

# ---------------------------------------------------------------------------
# Mobile-only dependencies (file access for content:// URIs, QR pairing)
# ---------------------------------------------------------------------------
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2"
tauri-plugin-barcode-scanner = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"
